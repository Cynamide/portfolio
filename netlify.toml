"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/blog/ml-systems"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/ml-systems/*"
  to = "/index.html"
  status = 200
